<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home | Giriş Yap</title>
    <!-- Modern Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css"> <!-- Base styles -->

    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .login-box {
            width: 450px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .role-cards {
            display: flex;
            gap: 16px;
            margin-top: 24px;
        }

        .role-card {
            flex: 1;
            padding: 24px 12px;
            border-radius: 16px;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            transition: 0.3s ease;
            font-weight: 500;
            font-size: 1.1rem;
        }

        .role-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            background: rgba(56, 189, 248, 0.1);
        }

        .role-card.admin:hover {
            border-color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
        }

        .back-btn {
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: transparent;
            align-self: flex-start;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            color: white;
        }

        .info-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .login-form-wrapper form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px;
            text-align: left;
        }
    </style>
</head>

<body>

    <!-- Background Orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="login-wrapper">
        <div class="login-box glass-panel">

            <!-- AŞAMA 1: ROL SEÇİMİ -->
            <div id="step-role-selection">
                <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                    <div class="logo-icon"></div>
                    <h2>SmartHome Security</h2>
                </div>
                <p class="info-text">Kurumsal ağa erişmek için önce giriş yapmak istediğiniz <b>yetki düzeyini</b>
                    seçiniz.</p>

                <div class="role-cards">
                    <div class="role-card admin" onclick="proceedToLogin('admin')">
                        <div style="font-size: 2rem; margin-bottom: 10px;">👑</div>
                        Yönetici Grubu
                    </div>
                    <div class="role-card" onclick="proceedToLogin('user')">
                        <div style="font-size: 2rem; margin-bottom: 10px;">👤</div>
                        Standart Üye
                    </div>
                </div>
            </div>

            <!-- AŞAMA 2: EMAIL VE PAROLA (Simülasyon) -->
            <div id="step-login-form" class="login-form-wrapper hidden">
                <button class="back-btn" onclick="goBack()">🔙 Geri Dön</button>
                <div class="logo" style="justify-content: center; margin-bottom: 10px;">
                    <div class="logo-icon"></div>
                </div>
                <h2 id="login-title">Giriş Yap</h2>
                <p class="info-text">Senaryo gereği e-posta ve parola kontrol edilmez. Rol ataması yapılır.</p>

                <form onsubmit="handleLoginSubmit(event)">
                    <div class="form-group">
                        <label>Kurumsal E-Posta</label>
                        <input type="email" placeholder="isim.soyisim@sirket.com" required>
                    </div>
                    <div class="form-group">
                        <label>Parola</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Sisteme Giriş Yap</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Login Logic -->
    <script>
        let selectedRole = '';

        function proceedToLogin(role) {
            selectedRole = role;
            document.getElementById('step-role-selection').classList.add('hidden');
            document.getElementById('step-login-form').classList.remove('hidden');
            document.getElementById('login-title').innerText = role === 'admin' ? 'Yönetici Girişi (Admin)' : 'Üye Girişi (User)';
        }

        function goBack() {
            document.getElementById('step-login-form').classList.add('hidden');
            document.getElementById('step-role-selection').classList.remove('hidden');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            // Kavram #50 Simülasyonu: Auth Token üretiliyor
            const fakeJWT = `eyJhbGci.payload(role=${selectedRole}).X9signature`;

            // LocalStorage'a kaydet
            localStorage.setItem('smarthome_token', fakeJWT);
            localStorage.setItem('smarthome_role', selectedRole);

            // Dashboard'a yönlendir
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
